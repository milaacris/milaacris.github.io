<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Распределение Продаж</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    p.instructions {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 1.5rem;
      background: #e8f0fe;
      padding: 1rem;
      border-left: 4px solid #4285f4;
      border-radius: 6px;
    }
    input[type="file"] {
      display: block;
      margin: 0 auto 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 0.5rem;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Распределение Продаж по Дням</h1>
  <p class="instructions">
    Загрузите CSV-файл в кодировке UTF-8 с разделителем <code>;</code>. Файл должен содержать колонки: <code>SKU</code>, <code>Month</code> (в формате YYYY-MM), <code>Value QTY</code>.<br>
    Для загрузки другого файла обновите страницу или выберите новый файл ниже.
  </p>
  <input type="file" id="csvFile" accept=".csv" />
  <div id="output"></div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script>
    document.getElementById('csvFile').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        delimiter: ";",
        complete: function (results) {
          const data = results.data;
          if (!data[0]["Value QTY"]) {
            alert("Отсутствует колонка 'Value QTY'");
            return;
          }

          const output = [];

          for (let i = 0; i < data.length; i++) {
            const row = data[i];
            const sku = row["SKU"];
            const month = row["Month"];
            const qty = parseInt(row["Value QTY"], 10);
            const [year, mon] = month.split("-");
            const daysInMonth = new Date(year, mon, 0).getDate();

            for (let d = 1; d <= daysInMonth; d++) {
              const date = `${month}-${String(d).padStart(2, '0')}`;
              let value = 0;

              if (qty < daysInMonth) {
                value = d <= qty ? 1 : 0;
              } else if (qty === daysInMonth) {
                value = 1;
              } else {
                const dailyQty = Math.floor(qty / daysInMonth);
                const remainder = qty % daysInMonth;
                value = dailyQty + (d <= remainder ? 1 : 0);
              }

              output.push({ SKU: sku, Date: date, Value: value });
            }
          }

          displayTable(output);
        }
      });
    });

    function displayTable(data) {
      const table = document.createElement('table');
      const headerRow = table.insertRow();
      ["SKU", "Date", "Value"].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        headerRow.appendChild(th);
      });

      data.forEach(row => {
        const tr = table.insertRow();
        [row.SKU, row.Date, row.Value].forEach(cellText => {
          const td = tr.insertCell();
          td.textContent = cellText;
        });
      });

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = "";
      outputDiv.appendChild(table);
    }
  </script>
</body>
</html>
